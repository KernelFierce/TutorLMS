<div class="flex items-center justify-center min-h-screen bg-slate-100">
  <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-2xl shadow-lg">
    <div class="text-center">
      <h2 class="mt-6 text-3xl font-bold text-slate-900">
        Create Your Organization
      </h2>
      <p class="mt-2 text-sm text-slate-600">
        Start managing your tutoring business with TutorHub.
      </p>
    </div>

    <form (ngSubmit)="handleSignup()" class="space-y-4">
      <div>
        <label for="org-name" class="block text-sm font-medium text-left text-slate-700">Organization Name</label>
        <div class="mt-1">
          <input id="org-name" name="org-name" type="text" required [(ngModel)]="model().organizationName"
                 class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>
      </div>
       <div>
        <label for="admin-name" class="block text-sm font-medium text-left text-slate-700">Your Full Name</label>
        <div class="mt-1">
          <input id="admin-name" name="admin-name" type="text" required [(ngModel)]="model().adminName"
                 class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>
      </div>
       <div>
        <label for="email" class="block text-sm font-medium text-left text-slate-700">Your Email Address</label>
        <div class="mt-1">
          <input id="email" name="email" type="email" autocomplete="email" required [(ngModel)]="model().adminEmail"
                 class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-left text-slate-700">Password</label>
        <div class="mt-1">
          <input id="password" name="password" type="password" required [(ngModel)]="model().password"
                 class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>
      </div>
      
      @if(errorMessage()) {
        <div class="bg-red-50 border-l-4 border-red-400 p-4">
            <p class="text-sm text-red-700">{{ errorMessage() }}</p>
        </div>
      }
      @if(successMessage()) {
        <div class="bg-green-50 border-l-4 border-green-400 p-4">
            <p class="text-sm text-green-700">{{ successMessage() }}</p>
        </div>
      }

      <div>
        <button type="submit" [disabled]="isSubmitting()"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:bg-indigo-400">
          Create Organization
        </button>
      </div>
    </form>
    
    <div class="text-center text-sm">
      <a (click)="onShowLogin()" class="font-medium text-indigo-600 hover:text-indigo-500 cursor-pointer">
        Already have an account? Sign In
      </a>
    </div>
  </div>
</div>
