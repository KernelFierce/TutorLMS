<div class="flex items-center justify-center min-h-screen bg-slate-100">
  <div class="w-full max-w-md p-8 space-y-8 bg-white rounded-2xl shadow-lg text-center">
    <div>
      <div class="flex items-center justify-center mx-auto h-16 w-16 bg-slate-800 rounded-full">
         <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v11.494m-9-5.747h18" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 6.75h4.5v10.5h-4.5z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.753l-4.243-4.243m8.486 0L12 18.753" />
        </svg>
      </div>
      <h2 class="mt-6 text-3xl font-bold text-slate-900">
        Welcome to TutorHub
      </h2>
      <p class="mt-2 text-sm text-slate-600">
        Your all-in-one tutoring management system.
      </p>
    </div>

    <!-- The Google script will render the official sign-in button inside this div -->
    <div class="flex justify-center">
      <div id="googleSignInButton"></div>
    </div>
    
    <div class="relative py-4">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-slate-300"></div>
      </div>
      <div class="relative flex justify-center text-sm">
        <span class="px-2 bg-white text-slate-500">Or simulate login for development</span>
      </div>
    </div>
    
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <button (click)="loginAs('Admin')" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-slate-600 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-500">
          Admin
        </button>
        <button (click)="loginAs('Teacher')" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          Teacher
        </button>
        <button (click)="loginAs('Student')" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-teal-600 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500">
          Student
        </button>
    </div>
  </div>
</div>
